<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Pong</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="shortcut icon" href="../../assets/images/circle-logo.png">
    <style>
        canvas {
            border: 2px solid white;
            display: block;
            margin: 20px auto;
            box-shadow: rgb(91, 219, 68) -50px 0px 1000px -50px, rgb(255, 82, 217) 50px 0px 1000px -50px;
        }

        label {
            font-size: 24px;
            padding: 10px;
        }

        input {
            font-size: 24px;
            border: none;
            background: rgba(100, 100, 100, 0.2);
            border-radius: 10px;
            color: white;
            padding: 8px;
            margin: 4px;
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html" class="navigation-backward">Home</a>
        <a href="../all-projects.html" class="navigation-backward">All Projects</a>
    </header>

    <main class="container">
        <h1>Auto Pong</h1>
        <canvas id="canvas" width="400" height="400"></canvas>

        <div class="banner">
            <h3>Controls</h2>

            <label for="ballSpeed">Ball Speed</label>
            <label for="ballSpeedX">x:</label>
            <input
            type="number"
            id="ballSpeedX"
            name="ballSpeedX"
            min="0"
            max="100"
            value="3" />
            <label for="ballSpeedY">y:</label>
            <input
            type="number"
            id="ballSpeedY"
            name="ballSpeedY"
            min="0"
            max="100"
            value="3" />

            <br>

            <label for="paddleSnapStrength">Paddle Snap Strength</label>
            <input
            type="number"
            id="paddleSnapStrength"
            name="paddleSnapStrength"
            min="0"
            max="1"
            value="0.08"
            step="0.01" />

            <br>

            <label for="ballSize">Ball Size</label>
            <input
            type="number"
            id="ballSize"
            name="ballSize"
            min="1"
            max="1000"
            value="50"
            step="1" />

            <br>

            <label for="paddleLength">Paddle Length</label>
            <input
            type="number"
            id="paddleLength"
            name="paddleLength"
            min="30"
            max="1000"
            value="100"
            step="1" />

            <br>

            <label for="canvasWidth">Canvas Width</label>
            <input
                type="number"
                id="canvasWidth"
                name="canvasWidth"
                min="100"
                max="2000"
                value="400"
                step="10" />

            <label for="canvasHeight">Canvas Height</label>
            <input
                type="number"
                id="canvasHeight"
                name="canvasHeight"
                min="100"
                max="2000"
                value="400"
                step="10" />
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
